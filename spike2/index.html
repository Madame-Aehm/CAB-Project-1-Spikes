<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox & CSS Animations!</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="flex-container">
      <div class="flex-item">
        <p>1</p>
      </div>
      <div class="flex-item">
        <p>2</p>
      </div>
      <div class="flex-item">
        <p>3</p>
      </div>
      <div class="flex-item">
        <p>4</p>
      </div>
      <div class="flex-item">
        <p>5</p>
      </div>
      <div class="flex-item">
        <p>6</p>
      </div>
      <div class="flex-item">
        <p>7</p>
      </div>
      <div class="flex-item">
        <p>8</p>
      </div>
      <div class="flex-item">
        <p>9</p>
      </div>
    </div>
    <p>Outside container <i class="material-icons icon-style">cake</i></p>
  </body>
</html>
