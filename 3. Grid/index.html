<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grid & Media Queries!</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <body>
      <div class="grid-template-container">
        <div class="grid-temp-item">
          <p>1</p>
        </div>
        <div class="grid-temp-item">
          <p>2</p>
        </div>
        <div class="grid-temp-item">
          <p>3</p>
        </div>
        <div class="grid-temp-item">
          <p>4</p>
        </div>
        <div class="grid-temp-item">
          <p>5</p>
        </div>
        <div class="grid-temp-item">
          <p>6</p>
        </div>
        <div class="grid-temp-item">
          <p>7</p>
        </div>
        <div class="grid-temp-item">
          <p>8</p>
        </div>
        <div class="grid-temp-item rogue-item">
          <p>9</p>
        </div>
      </div>
      <span>Outside container</span>

      <br />
      <br />

      <div class="grid-areas-container">
        <div class="grid-area-top1">
          <p>Top One</p>
        </div>
        <div class="grid-area-top2">
          <p>Top Two</p>
        </div>
        <div class="grid-area-left">
          <p>Left</p>
        </div>
        <div class="grid-area-main">
          <p>Main</p>
        </div>
        <div class="grid-area-bottom">
          <p>Bottom</p>
        </div>
      </div>
    </body>
  </body>
</html>
